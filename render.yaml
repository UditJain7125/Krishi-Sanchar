services:
  - type: web
    name: krishisanchar-crop
    runtime: python
    plan: free
    rootDir: Crop recommendation
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: krishisanchar-fertilizer
    runtime: python
    plan: free
    rootDir: Fertilizer recommendation
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn Fertilizer:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false

